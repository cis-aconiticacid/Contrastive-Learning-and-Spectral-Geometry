- data=pusht
- seed=0
- loader.batch_size=8
- loader.num_workers=0
- loader.persistent_workers=False
- loader.pin_memory=False
- ~loader.prefetch_factor
- trainer.max_epochs=1
- +trainer.limit_train_batches=3000
- +trainer.limit_val_batches=4
- wandb.enabled=False
- +probe_every=999999
- +jacobian_probe_n_samples=1
- +probing_n_train=128
- +probing_n_test=32
- +latent_cov_n_samples=128
- +freeze.enabled=true
- +freeze.stage1_ckpt=/workspace/lewm_autodl_results_v3/stage1_baseline_seed0_weights.ckpt
- +freeze.skip_sigreg=true
- output_model_name=tier1_randdiff
- +loss.rand_diff.weight=0.01
- +loss.rand_diff.eps=0.05
- +loss.rand_diff.num_dirs=2
