hydra:
  run:
    dir: hydra_runs/smoke_v2
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.job.id=smoke_v2
    - hydra.run.dir=hydra_runs/smoke_v2
    - hydra.mode=RUN
    task:
    - data=pusht
    - loader.batch_size=16
    - loader.num_workers=0
    - loader.persistent_workers=False
    - loader.pin_memory=False
    - loader.prefetch_factor=null
    - trainer.max_epochs=1
    - +trainer.limit_train_batches=300
    - +trainer.limit_val_batches=4
    - wandb.enabled=False
    - +probe_every=100
    - +jacobian_probe_n_samples=4
    - +probing_n_train=128
    - +probing_n_test=32
    - +latent_cov_n_samples=128
    - +predictor.ffn_rank=4
    - output_model_name=smoke_v2
  job:
    name: train
    chdir: null
    override_dirname: +jacobian_probe_n_samples=4,+latent_cov_n_samples=128,+predictor.ffn_rank=4,+probe_every=100,+probing_n_test=32,+probing_n_train=128,+trainer.limit_train_batches=300,+trainer.limit_val_batches=4,data=pusht,loader.batch_size=16,loader.num_workers=0,loader.persistent_workers=False,loader.pin_memory=False,loader.prefetch_factor=null,output_model_name=smoke_v2,trainer.max_epochs=1,wandb.enabled=False
    id: smoke_v2
    num: ???
    config_name: lewm
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /workspace/le-wm
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /workspace/le-wm/config/train
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /workspace/le-wm/hydra_runs/smoke_v2
    choices:
      data: pusht
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
