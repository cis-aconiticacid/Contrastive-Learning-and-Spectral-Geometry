- data=pusht
- seed=0
- loader.batch_size=32
- loader.num_workers=4
- loader.persistent_workers=True
- loader.pin_memory=True
- loader.prefetch_factor=2
- trainer.max_epochs=1
- +trainer.limit_train_batches=200
- +trainer.limit_val_batches=20
- wandb.enabled=False
- +probe_every=500
- +jacobian_probe_n_samples=6
- +probing_n_train=256
- +probing_n_test=64
- +latent_cov_n_samples=256
- +freeze.enabled=true
- +freeze.stage1_ckpt=/workspace/lewm_autodl_results_v3/stage1_baseline_seed0_weights.ckpt
- +freeze.skip_sigreg=true
- output_model_name=autodl_sanity
